# ==============================================================================
# OFFLINE RESILIENCE KNOWLEDGE VAULT - Nodogsplash Configuration (Captive Portal)
# ==============================================================================
GatewayInterface wlan0
GatewayName BIBLIOTECA_DIGITALA_OFFLINE
GatewayAddress 10.3.141.1
GatewayPort 2050
SplashPage splash.html
WebRoot /etc/nodogsplash/htdocs
MaxClients 250
PreAuthIdleTimeout 30
AuthIdleTimeout 720
SessionTimeout 1440
CheckInterval 60
RedirectURL http://10.3.141.1/

# Firewall rules for clients authenticated via splash.html buttons
FirewallRuleSet authenticated-users {
    FirewallRule allow tcp port 80 to 10.3.141.1
    FirewallRule allow tcp port 443 to 10.3.141.1
    FirewallRule allow udp port 53
    FirewallRule allow tcp port 53
    FirewallRule allow to 10.3.141.0/24
}

# Firewall rules for unauthenticated clients (allows DNS and intercepts port 80)
FirewallRuleSet preauthenticated-users {
    FirewallRule allow udp port 53
    FirewallRule allow tcp port 53
}

FirewallRuleSet users-to-router {
    FirewallRule allow udp port 53
    FirewallRule allow tcp port 53
    FirewallRule allow udp port 67
    FirewallRule allow tcp port 80
    FirewallRule allow tcp port 2050
}
