# ==============================================================================
# OFFLINE RESILIENCE KNOWLEDGE VAULT - dnsmasq Configuration (DHCP + Captive DNS)
# ==============================================================================
interface=wlan0
bind-dynamic
except-interface=lo

# Disable reading upstream /etc/resolv.conf (100% air-gapped operation)
no-resolv
no-poll
bogus-priv
domain-needed

# Local domain and DHCP lease allocation in the 10.3.141.0/24 subnet
domain=biblioteca.local
dhcp-range=10.3.141.50,10.3.141.250,255.255.255.0,12h
dhcp-option=option:router,10.3.141.1
dhcp-option=option:dns-server,10.3.141.1
dhcp-option=114,http://10.3.141.1/
dhcp-authoritative

# Wildcard DNS Hijack for Captive Portal Detection (iOS/macOS, Android, Windows, Linux)
address=/#/10.3.141.1
address=/captive.apple.com/10.3.141.1
address=/connectivitycheck.gstatic.com/10.3.141.1
address=/clients3.google.com/10.3.141.1
address=/www.msftconnecttest.com/10.3.141.1
address=/nmcheck.gnome.org/10.3.141.1
